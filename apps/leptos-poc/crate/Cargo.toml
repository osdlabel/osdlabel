[package]
name = "osdlabel-leptos"
version = "0.0.0"
edition = "2021"
publish = false
description = "Proof of concept: an osdlabel annotator whose UI is a Leptos app"

[lib]
# rlib so `cargo test` runs the browser-free parts natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
osdlabel-shell-protocol = { path = "../../shell-bridge/rust" }
serde_json = "1"

[dev-dependencies]
osdlabel-shell-protocol = { path = "../../shell-bridge/rust", features = ["fixtures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["console", "HtmlElement", "KeyboardEvent"] }
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
