[package]
name = "osdlabel-tui"
version = "0.0.0"
edition = "2021"
publish = false
description = "Proof of concept: an osdlabel annotator shell built with Ratzilla"

[lib]
crate-type = ["cdylib"]

[dependencies]
ratzilla = "0.3.1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["KeyboardEvent", "Window", "Document", "Element", "DomRect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1.7"
# ratatui (via portable-atomic) needs a critical-section implementation on wasm32.
critical-section = { version = "1.2", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
