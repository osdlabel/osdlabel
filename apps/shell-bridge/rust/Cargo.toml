[package]
name = "osdlabel-shell-protocol"
version = "0.0.0"
edition = "2021"
publish = false
description = "The JSON protocol between the Rust shell PoCs and the osdlabel bridge, and their shared keymap"

[features]
# The contract fixtures (`../contract/*.json`), for dependents' tests.
fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
