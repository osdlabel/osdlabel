name: Deploy Docs

# The site renders TypeDoc from every package and builds them first (`^build`;
# the demos bundle their output), so a change to any package's source, TypeDoc
# config, manifest or build config, or to the workspace's build setup, changes
# what gets deployed. Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'packages/*/typedoc.json'
      - 'packages/*/package.json'
      - 'packages/*/tsconfig*.json'
      - 'packages/*/vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'packages/*/typedoc.json'
      - 'packages/*/package.json'
      - 'packages/*/tsconfig*.json'
      - 'packages/*/vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per ref, so a new push only cancels that branch's own older run
# and never another PR's build or a deploy from main (#231).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v6.1.0 is the first release with pnpm 12 support; the floating v6 tag predates it.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build docs
        run: pnpm build --filter @osdlabel/docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    # Only main deploys: a workflow_dispatch from another branch builds it but
    # must not publish it, or take a pending main deploy's place in `pages`.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Deploys queue rather than cancel each other, so a run already uploading
    # to Pages always finishes; a newer pending one still replaces an older
    # pending one.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
