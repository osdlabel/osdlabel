name: Rust shell PoCs

# apps/ratzilla-poc and apps/leptos-poc need a Rust toolchain, which the main
# CI does not set up. Their TypeScript typecheck and lint, and the shared
# bridge's Vitest suites, already run in ci.yml; this adds the crates' tests
# and both E2E suites, only when something they exercise changes.
on:
  push:
    branches: [main, master]
    paths:
      - 'apps/ratzilla-poc/**'
      - 'apps/leptos-poc/**'
      - 'apps/shell-bridge/**'
      - 'apps/dev/sample-data/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/rust-shells.yml'
  pull_request:
    branches: [main, master]
    # Keep identical to the push list.
    paths:
      - 'apps/ratzilla-poc/**'
      - 'apps/leptos-poc/**'
      - 'apps/shell-bridge/**'
      - 'apps/dev/sample-data/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/rust-shells.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned for Playwright, as ci.yml's e2e-tests job is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # v6.1.0 is the first release with pnpm 12 support; the floating v6 tag predates it.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/shell-bridge/rust
            apps/ratzilla-poc/crate
            apps/leptos-poc/crate
      # Must match the `wasm-bindgen` version pinned in both crates' Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Install dependencies
        run: pnpm install
      - name: Protocol crate tests
        run: pnpm --filter @osdlabel/shell-bridge poc:test:rust
      - name: Ratzilla crate tests
        run: pnpm --filter @osdlabel/ratzilla-poc poc:test:rust
      - name: Leptos crate tests
        run: pnpm --filter @osdlabel/leptos-poc poc:test:rust
      - name: Build the library packages
        run: pnpm exec turbo run build --filter=@osdlabel/shell-bridge^...
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (Ratzilla)
        run: pnpm --filter @osdlabel/ratzilla-poc poc:test:e2e
      # Runs even when the Ratzilla suite fails, so both report.
      - name: E2E tests (Leptos)
        if: ${{ !cancelled() }}
        run: pnpm --filter @osdlabel/leptos-poc poc:test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-shells-playwright-report
          path: |
            apps/ratzilla-poc/playwright-report/
            apps/leptos-poc/playwright-report/
          retention-days: 30
