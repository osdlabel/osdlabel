name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v6.1.0 is the first release with pnpm 12 support; the floating v6 tag predates it.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Verify lockstep versions
        run: pnpm run check-versions
      - name: Run lint
        run: pnpm run lint
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Verify build
        run: pnpm run build
      - name: Run unit tests
        run: pnpm test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v6.1.0 is the first release with pnpm 12 support; the floating v6 tag predates it.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      
      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --depth 0 --json | jq -r '[.[] | .devDependencies["@playwright/test"]?.version | select(. != null)][0]')" >> $GITHUB_ENV
        
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
        
      # One suite after the other, not `pnpm test:e2e`, which runs both at once:
      # on a 4-core runner that is four browsers and two dev servers contending.
      # The React step runs even when the Solid one fails, so both report.
      - name: Run Playwright tests (SolidJS)
        run: pnpm exec turbo run test:e2e --filter=@osdlabel/dev

      - name: Run Playwright tests (React)
        if: ${{ !cancelled() }}
        run: pnpm exec turbo run test:e2e --filter=@osdlabel/dev-react
        
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/dev/playwright-report/
            apps/dev-react/playwright-report/
          retention-days: 30
