<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:sans-serif" viewBox="0 0 760 956" role="img" aria-label="A patch this week, one foundation release, then tracks in any order" font-size="13"><defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8985"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">A patch this week, one foundation release, then tracks in any order</text><text data-claude-text-id="subtitle" x="24" y="52" font-size="11.5" fill="#5e5d59">Weeks are one engineer&#x27;s estimate: the foundation and dataset workflow are mine, the rest come from the proofs of concept.</text><g data-claude-anchor="phase-week"><g><rect x="24" y="72" width="712" height="100" rx="8" fill="none" fill-opacity="1" stroke="#8a8985" stroke-width="1.25"></rect><line x1="200" y1="86" x2="200" y2="158" stroke="#d9d7d1"></line></g><text data-claude-text-id="week" x="40" y="102" font-size="15" font-weight="600" fill="#1f1e1d">This week</text><text data-claude-text-id="week-name" x="40" y="122" font-weight="600" fill="#1f1e1d">Before any release</text><text data-claude-text-id="week-note-1" x="40" y="140" font-size="11.5" fill="#5e5d59">a patch, a merge rule,</text><text data-claude-text-id="week-note-2" x="40" y="156" font-size="11.5" fill="#5e5d59">a benchmark run</text><text x="216" y="102" fill="#1f1e1d"><tspan data-claude-text-id="now-rect">Rectangle placement fix</tspan><tspan data-claude-text-id="now-rect-d" dx="8" font-size="11.5" fill="#5e5d59">ship as a patch; migration is question 17</tspan></text><text x="216" y="122" fill="#1f1e1d"><tspan data-claude-text-id="now-masks">#149&#x27;s mask format</tspan><tspan data-claude-text-id="now-masks-d" dx="8" font-size="11.5" fill="#5e5d59">downsample factor, or marked experimental</tspan></text><text x="216" y="142" fill="#1f1e1d"><tspan data-claude-text-id="week-gpu">Real-GPU benchmark run</tspan><tspan data-claude-text-id="week-gpu-d" dx="8" font-size="11.5" fill="#5e5d59">decides two defaults; question 16</tspan></text></g><g data-claude-anchor="link-a"><path d="M96 172V196" fill="none" stroke="#8a8985" stroke-width="1.25" marker-end="url(#road-arrow)"></path></g><g data-claude-anchor="phase-now"><g><rect x="24" y="196" width="712" height="184" rx="8" fill="#2a6fdb" fill-opacity="0.12" stroke="#2a6fdb" stroke-width="2"></rect><line x1="200" y1="210" x2="200" y2="366" stroke="#d9d7d1"></line></g><text data-claude-text-id="now" x="40" y="226" font-size="15" font-weight="600" fill="#1f1e1d">Now</text><text data-claude-text-id="now-name" x="40" y="246" font-weight="600" fill="#1f1e1d">Foundation release</text><text data-claude-text-id="now-note-1" x="40" y="264" font-size="11.5" fill="#5e5d59">one breaking 0.x</text><text data-claude-text-id="now-note-2" x="40" y="280" font-size="11.5" fill="#5e5d59">release, 9 to 14 weeks</text><text x="216" y="226" fill="#1f1e1d"><tspan data-claude-text-id="now-osd6">OpenSeadragon 6</tspan><tspan data-claude-text-id="now-osd6-d" dx="8" font-size="11.5" fill="#5e5d59">peer range ^6.1.1; about 13 lines</tspan></text><text x="216" y="246" fill="#1f1e1d"><tspan data-claude-text-id="now-context">Drawer policy</tspan><tspan data-claude-text-id="now-context-d" dx="8" font-size="11.5" fill="#5e5d59">canvas default, viewerOptions, context loss</tspan></text><text x="216" y="266" fill="#1f1e1d"><tspan data-claude-text-id="now-fabric">Render model</tspan><tspan data-claude-text-id="now-fabric-d" dx="8" font-size="11.5" fill="#5e5d59">Fabric caching off, culling on, keyed updates</tspan></text><text x="216" y="286" fill="#1f1e1d"><tspan data-claude-text-id="now-envelope">Versioned document</tspan><tspan data-claude-text-id="now-envelope-d" dx="8" font-size="11.5" fill="#5e5d59">with a schema hook for extension fields</tspan></text><text x="216" y="306" fill="#1f1e1d"><tspan data-claude-text-id="now-registry">Tool and geometry registry</tspan><tspan data-claude-text-id="now-registry-d" dx="8" font-size="11.5" fill="#5e5d59">prototype first; can follow in a second release</tspan></text><text x="216" y="326" fill="#1f1e1d"><tspan data-claude-text-id="now-viewsync">View sync, calibration regions</tspan><tspan data-claude-text-id="now-viewsync-d" dx="8" font-size="11.5" fill="#5e5d59">and a per-cell overlay hook</tspan></text><text x="216" y="346" fill="#1f1e1d"><tspan data-claude-text-id="now-calibration">DOM-free core, versioning policy</tspan><tspan data-claude-text-id="now-calibration-d" dx="8" font-size="11.5" fill="#5e5d59">internal export tier; leaves versioned alone</tspan></text><text x="216" y="366" fill="#1f1e1d"><tspan data-claude-text-id="now-maturity">Maturity fixes, alongside</tspan><tspan data-claude-text-id="now-maturity-d" dx="8" font-size="11.5" fill="#5e5d59">undo, shortcuts, selection, host events, zoom cap</tspan></text></g><g data-claude-anchor="gate-1"><path d="M96 380V404" fill="none" stroke="#8a8985" stroke-width="1.25"></path><polygon points="96,404 112,420 96,436 80,420" fill="none" stroke="#8a8985" stroke-width="1.25"></polygon><path d="M96 436V460" fill="none" stroke="#8a8985" stroke-width="1.25" marker-end="url(#road-arrow)"></path><text x="128" y="424" fill="#1f1e1d"><tspan data-claude-text-id="gate-1-name" font-weight="600">Gate 1</tspan><tspan data-claude-text-id="gate-1-criteria" dx="8" font-size="11.5" fill="#5e5d59">foundation released</tspan></text></g><g data-claude-anchor="phase-next"><g><rect x="24" y="460" width="712" height="144" rx="8" fill="none" fill-opacity="1" stroke="#8a8985" stroke-width="1.25"></rect><line x1="200" y1="474" x2="200" y2="590" stroke="#d9d7d1"></line></g><text data-claude-text-id="next" x="40" y="490" font-size="15" font-weight="600" fill="#1f1e1d">Next</text><text data-claude-text-id="next-name" x="40" y="510" font-weight="600" fill="#1f1e1d">Near-term tracks</text><text data-claude-text-id="next-note-1" x="40" y="528" font-size="11.5" fill="#5e5d59">in any order;</text><text data-claude-text-id="next-note-2" x="40" y="544" font-size="11.5" fill="#5e5d59">question 2</text><text x="216" y="490" fill="#1f1e1d"><tspan data-claude-text-id="next-dataset">Dataset workflow</tspan><tspan data-claude-text-id="next-dataset-d" dx="8" font-size="11.5" fill="#5e5d59">7 to 11 weeks, my estimate</tspan></text><text x="216" y="510" fill="#1f1e1d"><tspan data-claude-text-id="next-bulk">Read-only bulk layer</tspan><tspan data-claude-text-id="next-bulk-d" dx="8" font-size="11.5" fill="#5e5d59">2 to 3 weeks</tspan></text><text x="216" y="530" fill="#1f1e1d"><tspan data-claude-text-id="next-ui">UI contract and custom element</tspan><tspan data-claude-text-id="next-ui-d" dx="8" font-size="11.5" fill="#5e5d59">8 to 10 weeks</tspan></text><text x="216" y="550" fill="#1f1e1d"><tspan data-claude-text-id="next-sam">SAM for 2D, in a worker</tspan><tspan data-claude-text-id="next-sam-d" dx="8" font-size="11.5" fill="#5e5d59">8 to 9.5 weeks</tspan></text><text x="216" y="570" fill="#1f1e1d"><tspan data-claude-text-id="next-dicom">DICOM ingest, slides and export</tspan><tspan data-claude-text-id="next-dicom-d" dx="8" font-size="11.5" fill="#5e5d59">8 to 11 weeks</tspan></text><text x="216" y="590" fill="#1f1e1d"><tspan data-claude-text-id="next-pixel">16-bit windowing for CT and MR</tspan><tspan data-claude-text-id="next-pixel-d" dx="8" font-size="11.5" fill="#5e5d59">7 to 8.5 weeks, plus a 16-bit pixel source</tspan></text></g><g data-claude-anchor="link-c"><path d="M96 604V628" fill="none" stroke="#8a8985" stroke-width="1.25" marker-end="url(#road-arrow)"></path></g><g data-claude-anchor="phase-later"><g><rect x="24" y="628" width="712" height="100" rx="8" fill="none" fill-opacity="1" stroke="#8a8985" stroke-width="1.25"></rect><line x1="200" y1="642" x2="200" y2="714" stroke="#d9d7d1"></line></g><text data-claude-text-id="later" x="40" y="658" font-size="15" font-weight="600" fill="#1f1e1d">Later</text><text data-claude-text-id="later-name" x="40" y="678" font-weight="600" fill="#1f1e1d">Stacks</text><text data-claude-text-id="later-note-1" x="40" y="696" font-size="11.5" fill="#5e5d59">the frame axis the</text><text data-claude-text-id="later-note-2" x="40" y="712" font-size="11.5" fill="#5e5d59">rest reuses</text><text x="216" y="658" fill="#1f1e1d"><tspan data-claude-text-id="later-stacks">Stacks, cine and ultrasound</tspan><tspan data-claude-text-id="later-stacks-d" dx="8" font-size="11.5" fill="#5e5d59">about 7 weeks</tspan></text><text x="216" y="678" fill="#1f1e1d"><tspan data-claude-text-id="later-spike">Opening spike, about 3 weeks</tspan><tspan data-claude-text-id="later-spike-d" dx="8" font-size="11.5" fill="#5e5d59">presenter on OpenSeadragon 6, React per-frame path</tspan></text><text x="216" y="698" fill="#1f1e1d"><tspan data-claude-text-id="later-us">Ultrasound measurement</tspan><tspan data-claude-text-id="later-us-d" dx="8" font-size="11.5" fill="#5e5d59">about 1 week, region-aware; regions ship in the foundation</tspan></text></g><g data-claude-anchor="gate-2"><path d="M96 728V752" fill="none" stroke="#8a8985" stroke-width="1.25"></path><polygon points="96,752 112,768 96,784 80,768" fill="none" stroke="#8a8985" stroke-width="1.25"></polygon><path d="M96 784V808" fill="none" stroke="#8a8985" stroke-width="1.25" marker-end="url(#road-arrow)"></path><text x="128" y="772" fill="#1f1e1d"><tspan data-claude-text-id="gate-2-name" font-weight="600">Gate 2</tspan><tspan data-claude-text-id="gate-2-criteria" dx="8" font-size="11.5" fill="#5e5d59">stacks shipped in both bindings, still one paint</tspan></text></g><g data-claude-anchor="phase-then"><g><rect x="24" y="808" width="712" height="124" rx="8" fill="none" fill-opacity="1" stroke="#8a8985" stroke-width="1.25"></rect><line x1="200" y1="822" x2="200" y2="918" stroke="#d9d7d1"></line></g><text data-claude-text-id="then" x="40" y="838" font-size="15" font-weight="600" fill="#1f1e1d">Then</text><text data-claude-text-id="then-name" x="40" y="858" font-weight="600" fill="#1f1e1d">Video, and options</text><text data-claude-text-id="then-note-1" x="40" y="876" font-size="11.5" fill="#5e5d59">options start when</text><text data-claude-text-id="then-note-2" x="40" y="892" font-size="11.5" fill="#5e5d59">users ask for them</text><text x="216" y="838" fill="#1f1e1d"><tspan data-claude-text-id="later-video">Video and temporal tracks</tspan><tspan data-claude-text-id="later-video-d" dx="8" font-size="11.5" fill="#5e5d59">7.5 to 10 weeks, span labels first</tspan></text><text x="216" y="858" fill="#1f1e1d"><tspan data-claude-text-id="later-volume">Option: volumes and MPR</tspan><tspan data-claude-text-id="later-volume-d" dx="8" font-size="11.5" fill="#5e5d59">11 to 15 weeks, after an engine comparison</tspan></text><text x="216" y="878" fill="#1f1e1d"><tspan data-claude-text-id="later-niivue">Option: 3D cell with Niivue</tspan><tspan data-claude-text-id="later-niivue-d" dx="8" font-size="11.5" fill="#5e5d59">after the real-GPU run</tspan></text><text x="216" y="898" fill="#1f1e1d"><tspan data-claude-text-id="later-sessions">Option: SAM sessions for 3D and video</tspan><tspan data-claude-text-id="later-sessions-d" dx="8" font-size="11.5" fill="#5e5d59">4 to 6 weeks, adapters to existing servers</tspan></text></g></svg>