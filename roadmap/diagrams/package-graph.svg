<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:sans-serif" viewBox="0 0 760 1040" role="img" aria-label="New capabilities land as leaf packages; the core opens a few seams" font-size="11.5"><defs><marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8985"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">New capabilities land as leaf packages; the core opens a few seams</text><text data-claude-text-id="subtitle" x="24" y="52" fill="#5e5d59">Solid border: on main, or in #149 (mask). Dashed: proposed, prototyped on a proof-of-concept branch. Accent box: seams in existing packages.</text><g data-claude-anchor="core"><rect x="24" y="72" width="712" height="464" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25"></rect><text data-claude-text-id="core-name" x="40" y="96" font-size="13" font-weight="600" fill="#1f1e1d">Core: each layer depends only on the layers below it</text><text data-claude-text-id="row-bindings" x="40" y="130" fill="#5e5d59">Bindings</text><text data-claude-text-id="row-shared" x="40" y="166" fill="#5e5d59">Shared</text><text data-claude-text-id="row-bridges" x="40" y="202" fill="#5e5d59">Bridges</text><text data-claude-text-id="row-model" x="40" y="238" fill="#5e5d59">Model</text></g><g data-claude-anchor="pkg-solid"><rect x="104" y="112" width="56" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="solid" x="132" y="130" text-anchor="middle" fill="#1f1e1d">solid</text></g><g data-claude-anchor="pkg-react"><rect x="168" y="112" width="56" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="react" x="196" y="130" text-anchor="middle" fill="#1f1e1d">react</text></g><g data-claude-anchor="pkg-element"><rect x="232" y="112" width="72" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="element" x="268" y="130" text-anchor="middle" fill="#1f1e1d">element</text></g><g data-claude-anchor="pkg-osdlabel"><rect x="104" y="148" width="72" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="osdlabel" x="140" y="166" text-anchor="middle" fill="#1f1e1d">osdlabel</text></g><g data-claude-anchor="pkg-ui"><rect x="184" y="148" width="48" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="ui" x="208" y="166" text-anchor="middle" fill="#1f1e1d">ui</text></g><g data-claude-anchor="pkg-fabric-annotations"><rect x="104" y="184" width="128" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="fabric-annotations" x="168" y="202" text-anchor="middle" fill="#1f1e1d">fabric-annotations</text></g><g data-claude-anchor="pkg-fabric-osd"><rect x="240" y="184" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="fabric-osd" x="279" y="202" text-anchor="middle" fill="#1f1e1d">fabric-osd</text></g><g data-claude-anchor="pkg-osd-helper"><rect x="326" y="184" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="osd-helper" x="365" y="202" text-anchor="middle" fill="#1f1e1d">osd-helper</text></g><g data-claude-anchor="pkg-annotation"><rect x="104" y="220" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="annotation" x="143" y="238" text-anchor="middle" fill="#1f1e1d">annotation</text></g><g data-claude-anchor="pkg-mask"><rect x="190" y="220" width="48" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="mask" x="214" y="238" text-anchor="middle" fill="#1f1e1d">mask</text></g><g data-claude-anchor="pkg-viewer-api"><rect x="246" y="220" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="viewer-api" x="285" y="238" text-anchor="middle" fill="#1f1e1d">viewer-api</text></g><g data-claude-anchor="pkg-geometry"><rect x="332" y="220" width="66" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="geometry" x="365" y="238" text-anchor="middle" fill="#1f1e1d">geometry</text></g><g data-claude-anchor="pkg-annotation-context"><rect x="104" y="256" width="128" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="annotation-context" x="168" y="274" text-anchor="middle" fill="#1f1e1d">annotation-context</text></g><g data-claude-anchor="pkg-decoration"><rect x="240" y="256" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="decoration" x="279" y="274" text-anchor="middle" fill="#1f1e1d">decoration</text></g><g data-claude-anchor="pkg-validation"><rect x="326" y="256" width="78" height="28" rx="6" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="validation" x="365" y="274" text-anchor="middle" fill="#1f1e1d">validation</text></g><g data-claude-anchor="seams"><rect x="40" y="300" width="680" height="220" rx="8" fill="#2a6fdb" fill-opacity="0.12" stroke="#2a6fdb" stroke-width="2"></rect><text data-claude-text-id="seams-name" x="56" y="324" font-size="13" font-weight="600" fill="#1f1e1d">Seams to open in existing packages</text><text data-claude-text-id="seams-foundation" x="56" y="344" font-weight="600" fill="#1f1e1d">In the foundation release</text><text x="56" y="362" fill="#1f1e1d"><tspan data-claude-text-id="seam-registry" font-size="13">Tool and geometry registry</tspan><tspan data-claude-text-id="seam-registry-pkgs" dx="8" fill="#5e5d59">· annotation, validation, annotation-context, osdlabel</tspan></text><text x="56" y="380" fill="#1f1e1d"><tspan data-claude-text-id="seam-envelope" font-size="13">Versioned document and schema hook</tspan><tspan data-claude-text-id="seam-envelope-pkgs" dx="8" fill="#5e5d59">· osdlabel, validation</tspan></text><text x="56" y="398" fill="#1f1e1d"><tspan data-claude-text-id="seam-viewsync" font-size="13">Renderer-neutral view sync, imageId on decorations</tspan><tspan data-claude-text-id="seam-viewsync-pkgs" dx="8" fill="#5e5d59">· fabric-osd, decoration, osdlabel, both bindings</tspan></text><text x="56" y="416" fill="#1f1e1d"><tspan data-claude-text-id="seam-drawer" font-size="13">Drawer policy, viewerOptions, context loss, caching</tspan><tspan data-claude-text-id="seam-drawer-pkgs" dx="8" fill="#5e5d59">· fabric-annotations, fabric-osd, osd-helper, bindings</tspan></text><text x="56" y="434" fill="#1f1e1d"><tspan data-claude-text-id="seam-calibration" font-size="13">Calibration regions</tspan><tspan data-claude-text-id="seam-calibration-pkgs" dx="8" fill="#5e5d59">· viewer-api, decoration</tspan></text><text x="56" y="452" fill="#1f1e1d"><tspan data-claude-text-id="seam-hook" font-size="13">Per-cell overlay hook, DOM-free core entry</tspan><tspan data-claude-text-id="seam-hook-pkgs" dx="8" fill="#5e5d59">· osdlabel, solid, react</tspan></text><text data-claude-text-id="seams-tracks" x="56" y="470" font-weight="600" fill="#1f1e1d">With their tracks</text><text x="56" y="488" fill="#1f1e1d"><tspan data-claude-text-id="seam-ui" font-size="13">UI contract, with styling</tspan><tspan data-claude-text-id="seam-ui-pkgs" dx="8" fill="#5e5d59">· ui, both bindings</tspan></text><text x="56" y="506" fill="#1f1e1d"><tspan data-claude-text-id="seam-frame" font-size="13">Frame presenter and slice grouping, with stacks</tspan><tspan data-claude-text-id="seam-frame-pkgs" dx="8" fill="#5e5d59">· viewer-api, osdlabel, both bindings</tspan></text></g><g data-claude-anchor="dependency"><path d="M380 584V537" fill="none" stroke="#8a8985" stroke-width="1.25" marker-end="url(#graph-arrow)"></path><text data-claude-text-id="depends-label" x="392" y="564" fill="#5e5d59">leaves depend on the core; the core never imports a leaf</text></g><g data-claude-anchor="leaves"><rect x="24" y="584" width="712" height="432" rx="8" fill="none" stroke="#d9d7d1" stroke-width="1.25"></rect><text data-claude-text-id="leaves-name" x="40" y="608" font-size="13" font-weight="600" fill="#1f1e1d">Proposed leaf packages, by track</text></g><g data-claude-anchor="track-2d"><rect x="40" y="624" width="332" height="136" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="track-2d-name" x="52" y="648" font-size="13" font-weight="600" fill="#1f1e1d">2D medical imaging and DICOM</text><text data-claude-text-id="leaf-pixel" x="52" y="664" fill="#1f1e1d">pixel: window/level math, the pixel-read contract</text><text data-claude-text-id="leaf-osd-pixel" x="52" y="680" fill="#1f1e1d">osd-pixel: 16-bit tile source, windowing drawer</text><text data-claude-text-id="leaf-dicom-io" x="52" y="696" fill="#1f1e1d">dicom-io: read via dicom-parser, write in-house</text><text data-claude-text-id="leaf-dicom" x="52" y="712" fill="#1f1e1d">dicom: tags to plain spacing, windows, planes</text><text data-claude-text-id="leaf-dicom-wsi" x="52" y="728" fill="#1f1e1d">dicom-wsi: slides over HTTP, DICOMweb or files</text><text data-claude-text-id="leaf-dicom-export" x="52" y="744" fill="#1f1e1d">dicom-export: SR, SEG, bulk annotations</text></g><g data-claude-anchor="track-dataset"><rect x="40" y="776" width="332" height="120" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="track-dataset-name" x="52" y="800" font-size="13" font-weight="600" fill="#1f1e1d">Dataset workflow</text><text data-claude-text-id="leaf-bulk-layer" x="52" y="816" fill="#1f1e1d">bulk-layer: thousands of read-only shapes</text><text data-claude-text-id="leaf-export" x="52" y="832" fill="#1f1e1d">export leaves: COCO, YOLO, NIfTI label maps</text><text data-claude-text-id="leaf-interpolate" x="52" y="848" fill="#1f1e1d">interpolate: shapes between slices (itk-wasm)</text><text data-claude-text-id="leaf-recist" x="52" y="864" fill="#1f1e1d">recist: tool with lesion identity</text><text data-claude-text-id="leaf-review" x="52" y="880" fill="#5e5d59">review status and attributes live in the envelope</text></g><g data-claude-anchor="track-assist"><rect x="388" y="624" width="332" height="152" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="track-assist-name" x="400" y="648" font-size="13" font-weight="600" fill="#1f1e1d">Assisted segmentation (SAM)</text><text data-claude-text-id="leaf-segmentation" x="400" y="664" fill="#1f1e1d">segmentation: provider contract and cache</text><text data-claude-text-id="leaf-segmentation-onnx" x="400" y="680" fill="#1f1e1d">segmentation-onnx: SAM models, WebGPU gate</text><text data-claude-text-id="leaf-segmentation-fabric" x="400" y="696" fill="#1f1e1d">segmentation-fabric: the click-and-box tool</text><text data-claude-text-id="leaf-region-reader" x="400" y="712" fill="#1f1e1d">region-reader: model-sized crops from tiles</text><text data-claude-text-id="leaf-mask-contour" x="400" y="728" fill="#1f1e1d">mask-contour: masks to polygons and back</text><text data-claude-text-id="leaf-segmentation-worker" x="400" y="744" fill="#1f1e1d">segmentation-worker: any provider in a worker</text><text data-claude-text-id="leaf-segmentation-remote" x="400" y="760" fill="#1f1e1d">segmentation-remote: adapters to existing servers</text></g><g data-claude-anchor="track-time"><rect x="388" y="792" width="332" height="104" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="track-time-name" x="400" y="816" font-size="13" font-weight="600" fill="#1f1e1d">Stacks, cine and video</text><text data-claude-text-id="leaf-frame" x="400" y="832" fill="#1f1e1d">frame: the frame axis, no dependencies</text><text data-claude-text-id="leaf-frame-osd" x="400" y="848" fill="#1f1e1d">frame-osd: in-place presenter for frames and planes</text><text data-claude-text-id="leaf-temporal" x="400" y="864" fill="#1f1e1d">temporal: keyframe interpolation, no wire format</text><text data-claude-text-id="leaf-video" x="400" y="880" fill="#1f1e1d">video: decode only, over a demuxer adapter</text></g><g data-claude-anchor="track-space"><rect x="40" y="912" width="680" height="88" rx="8" fill="none" stroke="#8a8985" stroke-width="1.25" stroke-dasharray="4 3"></rect><text data-claude-text-id="track-space-name" x="52" y="936" font-size="13" font-weight="600" fill="#1f1e1d">Options: volumes, MPR and 3D</text><text data-claude-text-id="leaf-spatial" x="52" y="952" fill="#1f1e1d">spatial: planes and volume geometry</text><text data-claude-text-id="leaf-volume" x="52" y="968" fill="#1f1e1d">volume: voxels, CPU reslicing, bricked label maps</text><text data-claude-text-id="leaf-mpr" x="52" y="984" fill="#1f1e1d">mpr: reversible plane IDs, cross-view decorations</text><text data-claude-text-id="leaf-reslice-webgl" x="400" y="952" fill="#1f1e1d">reslice-webgl: optional GPU reslicer</text><text data-claude-text-id="leaf-niivue" x="400" y="968" fill="#1f1e1d">niivue: optional 3D cell</text><text data-claude-text-id="leaf-planes-note" x="400" y="984" fill="#5e5d59">planes are shown through frame-osd</text></g></svg>